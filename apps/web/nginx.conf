server {
    listen 80;
    listen 10000;
    listen [::]:80;
    listen [::]:10000;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Redirect stale /error routes (e.g. from Open WebUI browser cache/autocomplete) to root /
    location = /error {
        return 302 /;
    }

    # Web service healthcheck endpoint
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"labellens-web","version":"1.0.0"}';
    }

    # Proxy API healthcheck directly to FastAPI backend service (dynamic resolver prevents startup crash)
    location = /api/health {
        resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;
        set $api_health_backend "http://labellens-api:8000/health";
        proxy_pass $api_health_backend;
        proxy_set_header Host $host;
    }

    # Proxy API calls directly to FastAPI backend service (dynamic resolver prevents startup crash)
    location /api/ {
        resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;
        set $api_backend "http://labellens-api:8000";
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    # Static assets and SPA routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
