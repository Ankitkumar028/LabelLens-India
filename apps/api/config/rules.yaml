version: "2.0.0"
disclaimer: "Informational only, not medical advice."

# Reference public health standards
standards:
  who_daily_references:
    sodium_mg: 2000.0        # < 2,000 mg/day (~5g salt)
    free_sugars_g: 50.0      # < 10% daily energy intake (conditional < 25g/day for added benefit)
    saturated_fat_g: 22.0    # < 10% daily energy intake (~22g for 2000 kcal diet)
    trans_fat_g: 2.0         # < 1% daily energy intake
    dietary_fibre_g: 25.0    # >= 25g naturally occurring fibre/day

# Dictionaries for ingredient analysis
dictionaries:
  sugar_aliases:
    - "maltodextrin"
    - "dextrose"
    - "invert syrup"
    - "invert sugar syrup"
    - "invert sugar"
    - "liquid glucose"
    - "glucose syrup"
    - "high fructose corn syrup"
    - "hfcs"
    - "corn syrup"
    - "jaggery"
    - "jaggery syrup"
    - "molasses"
    - "sucrose"
    - "brown sugar"
    - "cane sugar"
    - "fructose"
    - "honey"
    - "agave nectar"
    - "barley malt extract"
    - "malt extract"
    - "caramel"
    - "fruit juice concentrate"
    - "golden syrup"
    - "rice syrup"
    - "date syrup"

  sugar_primary_names:
    - "sugar"
    - "refined sugar"
    - "white sugar"
    - "cane sugar"
    - "sucrose"
    - "invert sugar"
    - "invert syrup"
    - "brown sugar"

  hydrogenated_fat_indicators:
    - "hydrogenated vegetable oil"
    - "hydrogenated vegetable fat"
    - "partially hydrogenated vegetable oil"
    - "partially hydrogenated vegetable fat"
    - "partially hydrogenated"
    - "vanaspati"
    - "interesterified vegetable fat"
    - "interesterified fat"
    - "margarine"
    - "shortening"

# Nutrient thresholds (per 100g)
thresholds:
  high_total_sugar_g_per_100g: 10.0
  high_saturated_fat_g_per_100g: 4.0
  high_trans_fat_g_per_100g: 0.2
  high_sodium_mg_per_100g: 400.0
  good_fibre_g_per_100g: 3.0
  good_protein_g_per_100g: 8.0

# Base score and grading
scoring:
  base_score: 100
  minimum_score: 0
  maximum_score: 100
  grades:
    green:
      min_score: 70
      label: "GREEN"
      description: "Nutritionally balanced choice adhering closely to WHO dietary recommendations."
    amber:
      min_score: 40
      label: "AMBER"
      description: "Moderate caution advised; check declared sugars, saturated fat, or sodium per serving."
    red:
      min_score: 0
      label: "RED"
      description: "Higher in critical nutrients (sodium, sugars, or saturated fat) compared with WHO reference intake."

  # Transparent nutrient adjustments (sum reconciles exactly with displayed score)
  nutrient_penalties:
    total_sugar_deduction_rate: 1.2
    sat_fat_deduction_rate: 2.0
    trans_fat_deduction_rate: 15.0
    sodium_deduction_per_100mg: 2.5
    fibre_bonus_rate: 2.0
    max_fibre_bonus: 10.0
    protein_bonus_rate: 1.0
    max_protein_bonus: 5.0

# Nutritional observation rules (evaluated for red_flags)
rules:
  - id: "nutrition_table_missing_or_incomplete"
    severity: "HIGH"
    category: "nutrition"
    title: "Nutrition Table Incomplete"
    penalty: 25
    description: "Core macronutrient values (energy, protein, carbohydrates, total fat) are undeclared or unreadable in the provided image."
    check: "nutrition_table_incomplete"

  - id: "added_sugar_undeclared_high_total"
    severity: "MEDIUM"
    category: "sugar"
    title: "Added Sugar Undeclared with High Total Sugar"
    penalty: 15
    description: "Added sugar is not separately declared, while total sugar is high (>10g per 100g). FSSAI 2020 mandates explicit added sugar declaration."
    check: "added_sugar_undeclared_high_total"

  - id: "trans_fat_undeclared_or_hydrogenated"
    severity: "HIGH"
    category: "fats"
    title: "Trans Fat Undeclared or Hydrogenated Fat Present"
    penalty: 25
    description: "Trans fat declaration omitted, or ingredients indicate presence of hydrogenated oils or vanaspati. WHO recommends eliminating industrial trans fats."
    check: "trans_fat_undeclared_or_hydrogenated"

  - id: "sodium_missing"
    severity: "MEDIUM"
    category: "minerals"
    title: "Sodium Content Missing"
    penalty: 10
    description: "Sodium content is missing from the nutritional declaration, preventing assessment of salt intake against WHO guidance."
    check: "sodium_missing"

  - id: "hidden_sugar_aliases"
    severity: "INFO"
    category: "sugar"
    title: "Alternative Carbohydrate / Sugar Ingredients"
    penalty: 5
    description: "Ingredients list contains refined sugar derivatives or syrups (e.g. maltodextrin, invert syrup, glucose). Consider their contribution to overall carbohydrate intake."
    check: "hidden_sugar_aliases"

  - id: "sugar_in_first_three_ingredients"
    severity: "HIGH"
    category: "sugar"
    title: "Sugar Among First 3 Ingredients"
    penalty: 20
    description: "Sugar or syrups appear among the top 3 ingredients by weight, indicating a predominant sugar formulation."
    check: "sugar_in_first_three_ingredients"

  - id: "misleading_claim_no_added_sugar"
    severity: "HIGH"
    category: "claims"
    title: "Claim Inconsistency: 'No Added Sugar'"
    penalty: 25
    description: "Product claims 'no added sugar' or 'sugar free', but sugar sources or syrups are declared in the ingredient list."
    check: "misleading_claim_no_added_sugar"

  - id: "fssai_license_missing"
    severity: "MEDIUM"
    category: "regulatory"
    title: "FSSAI License Not Found"
    penalty: 15
    description: "Mandatory 14-digit FSSAI license / registration mark is not visible or declared on the packaging."
    check: "fssai_license_missing"

  - id: "veg_nonveg_mark_missing"
    severity: "MEDIUM"
    category: "regulatory"
    title: "Veg/Non-Veg Mark Missing"
    penalty: 10
    description: "Mandatory FSSAI green (vegetarian) or brown (non-vegetarian) dot indicator is not clearly detected on the packaging."
    check: "veg_nonveg_mark_missing"

  - id: "allergen_statement_missing"
    severity: "MEDIUM"
    category: "regulatory"
    title: "Allergen Statement Undeclared"
    penalty: 10
    description: "No allergen declaration found. FSSAI requires explicit declaration of common allergens or 'Contains: None'."
    check: "allergen_statement_missing"

  - id: "serving_without_per_100g"
    severity: "LOW"
    category: "transparency"
    title: "Per-Serving Shown but Per-100g Missing"
    penalty: 5
    description: "Nutrition is provided per serving only, omitting standard per-100g values needed for fair product comparison."
    check: "serving_without_per_100g"

# FSSAI 2020 Packaging & Display Regulations Checks
compliance_checks:
  - id: "fssai_license"
    title: "14-Digit FSSAI License Number"
    fssai_clause: "FSSAI (Labelling & Display) Regulations 2020, Chapter 2, Clause 5(5)"
    description: "Mandatory FSSAI logo and 14-digit license/registration number of the manufacturer or marketer."

  - id: "veg_nonveg_symbol"
    title: "Vegetarian / Non-Vegetarian Symbol"
    fssai_clause: "FSSAI (Labelling & Display) Regulations 2020, Chapter 2, Clause 5(4)"
    description: "Mandatory green filled circle in square (Veg) or brown filled triangle in square (Non-Veg) on the Principal Display Panel."

  - id: "allergen_declaration"
    title: "Allergen Statement"
    fssai_clause: "FSSAI (Labelling & Display) Regulations 2020, Chapter 2, Clause 5(3)(ix)"
    description: "Mandatory declaration for cereals with gluten, nuts, milk, soy, eggs, fish, sulphites, or 'Contains: None'."

  - id: "per_100g_format"
    title: "Per 100g / 100ml Nutrition Declaration"
    fssai_clause: "FSSAI (Labelling & Display) Regulations 2020, Chapter 2, Clause 5(3)"
    description: "Nutritional values must be declared per 100g or 100ml in addition to per-serving figures."

  - id: "date_marking"
    title: "Date of Manufacture & Best Before / Expiry"
    fssai_clause: "FSSAI (Labelling & Display) Regulations 2020, Chapter 2, Clause 5(10)"
    description: "Mandatory declaration of date of manufacture/packaging and expiry or best-before period."
