services:
  # Backend FastAPI Service (Free Tier)
  - type: web
    name: labellens-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: RULES_CONFIG_PATH
        value: /app/config/rules.yaml
      - key: ENVIRONMENT
        value: production

  # Frontend Web Service (Free Tier)
  - type: web
    name: labellens-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: labellens-api
          property: host
      - key: API_BACKEND_URL
        value: http://labellens-api:8000

  # Grafana + Prometheus Monitoring Service (Free Tier)
  - type: web
    name: labellens-monitoring
    runtime: docker
    dockerfilePath: ./infra/monitoring/Dockerfile
    dockerContext: ./infra/monitoring
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_SECURITY_ADMIN_PASSWORD
        value: admin
      - key: GF_AUTH_ANONYMOUS_ENABLED
        value: "true"
      - key: API_METRICS_HOST
        value: labellens-api-ktax.onrender.com
      - key: API_METRICS_SCHEME
        value: https
