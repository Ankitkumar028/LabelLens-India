# Compose configuration for AMD ROCm GPU droplet running vLLM (Qwen2.5-VL-7B-Instruct)
services:
  vllm:
    image: rocm/vllm:latest
    container_name: labellens-vllm-rocm
    ports:
      - "8001:8000"
    environment:
      - MODEL=Qwen/Qwen2.5-VL-7B-Instruct
      - MAX_MODEL_LEN=4096
      - TRUST_REMOTE_CODE=1
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    security_opt:
      - seccomp=unconfined
    group_add:
      - "video"
      - "render"
    command: >
      python3 -m vllm.entrypoints.openai.api_server
      --model Qwen/Qwen2.5-VL-7B-Instruct
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
    restart: unless-stopped
    networks:
      - labellens-net

networks:
  labellens-net:
    driver: bridge
