<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" />
      <stop offset="100%" stop-color="#161f30" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="800" fill="url(#bg-grad)" rx="16"/>

  <!-- Title & Header -->
  <text x="550" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f9fafb" text-anchor="middle" letter-spacing="1">
    LABELLENS INDIA — PRODUCTION SYSTEM ARCHITECTURE
  </text>
  <text x="550" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9ca3af" text-anchor="middle">
    AI-Assisted DevOps • FSSAI Regulatory Engine • Swappable Vision LLMs • Zero-Cost Cloud Infrastructure
  </text>

  <!-- ROW 1: CLIENT & GATEWAY -->
  <!-- Box: Web Frontend -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="300" height="150" rx="12" fill="url(#card-grad)" stroke="#374151" stroke-width="1.5"/>
    <rect x="50" y="110" width="300" height="36" rx="12" fill="#1e293b"/>
    <rect x="50" y="134" width="300" height="12" fill="#1e293b"/>
    <circle cx="70" cy="128" r="5" fill="#ef4444"/>
    <circle cx="85" cy="128" r="5" fill="#f59e0b"/>
    <circle cx="100" cy="128" r="5" fill="#10b981"/>
    <text x="120" y="132" font-family="sans-serif" font-size="13" font-weight="700" fill="#e5e7eb">React Frontend (Vite + Nginx)</text>
    
    <text x="70" y="170" font-family="sans-serif" font-size="12" fill="#d1d5db">• Live Camera Capture &amp; Mobile Picker</text>
    <text x="70" y="190" font-family="sans-serif" font-size="12" fill="#d1d5db">• Traffic-Light Health Score Gauge</text>
    <text x="70" y="210" font-family="sans-serif" font-size="12" fill="#d1d5db">• Interactive Nutrition Inspector (OCR edit)</text>
    <text x="70" y="230" font-family="sans-serif" font-size="12" fill="#d1d5db">• Port: 3000 • Health: /health</text>
  </g>

  <!-- Arrow: Web to API -->
  <path d="M 350 185 L 420 185" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="385" y="175" font-family="sans-serif" font-size="10" font-weight="600" fill="#93c5fd" text-anchor="middle">Reverse Proxy /api</text>

  <!-- Box: Backend API -->
  <g filter="url(#shadow)">
    <rect x="420" y="110" width="330" height="150" rx="12" fill="url(#card-grad)" stroke="#374151" stroke-width="1.5"/>
    <rect x="420" y="110" width="330" height="36" rx="12" fill="#1e293b"/>
    <rect x="420" y="134" width="330" height="12" fill="#1e293b"/>
    <text x="440" y="132" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">FastAPI Core Service (Python 3.11)</text>

    <text x="440" y="170" font-family="sans-serif" font-size="12" fill="#d1d5db">• POST /api/analyze &amp; POST /api/score</text>
    <text x="440" y="190" font-family="sans-serif" font-size="12" fill="#d1d5db">• LabelExtraction Schema Validation</text>
    <text x="440" y="210" font-family="sans-serif" font-size="12" fill="#d1d5db">• EXIF Scrubbing &amp; 8MB Limits</text>
    <text x="440" y="230" font-family="sans-serif" font-size="12" fill="#d1d5db">• Port: 8000 • /health &amp; /metrics</text>
  </g>

  <!-- Arrow: API to Rules Engine -->
  <path d="M 750 185 L 810 185" stroke="#34d399" stroke-width="2.5"/>

  <!-- Box: Rules Engine (YAML) -->
  <g filter="url(#shadow)">
    <rect x="810" y="110" width="240" height="150" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="810" y="110" width="240" height="36" rx="12" fill="#064e3b"/>
    <rect x="810" y="134" width="240" height="12" fill="#064e3b"/>
    <text x="830" y="132" font-family="sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">FSSAI Rules Engine</text>

    <text x="830" y="170" font-family="sans-serif" font-size="12" fill="#d1d5db">• rules.yaml Configuration</text>
    <text x="830" y="190" font-family="sans-serif" font-size="12" fill="#d1d5db">• Sugar, Fat &amp; Salt Thresholds</text>
    <text x="830" y="210" font-family="sans-serif" font-size="12" fill="#d1d5db">• 100-Point Scoring Algorithm</text>
    <text x="830" y="230" font-family="sans-serif" font-size="12" fill="#a7f3d0">Zero Code Deployments</text>
  </g>

  <!-- ROW 2: SWAPPABLE LLM PROVIDER TIER -->
  <rect x="50" y="290" width="1000" height="210" rx="14" fill="#0f172a" stroke="#334155" stroke-dasharray="6"/>
  <text x="80" y="318" font-family="sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">
    ⚡ SWAPPABLE MULTIMODAL VISION PROVIDER TIER (LLM_PROVIDER=vllm|gemini|mock)
  </text>

  <!-- Arrow from API down to Provider Layer -->
  <path d="M 585 260 L 585 330" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- Option 1: AMD ROCm vLLM -->
  <g filter="url(#shadow)">
    <rect x="75" y="340" width="290" height="135" rx="10" fill="url(#card-grad)" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="75" y="340" width="290" height="30" rx="10" fill="#881337"/>
    <rect x="75" y="360" width="290" height="10" fill="#881337"/>
    <text x="90" y="360" font-family="sans-serif" font-size="12" font-weight="700" fill="#fecdd3">AMD MI300X ROCm Droplet</text>
    
    <text x="90" y="395" font-family="sans-serif" font-size="11" fill="#e2e8f0">• Model: Qwen2.5-VL-7B-Instruct</text>
    <text x="90" y="415" font-family="sans-serif" font-size="11" fill="#e2e8f0">• Latency: 480 ms • 64.2 tok/s</text>
    <text x="90" y="435" font-family="sans-serif" font-size="11" fill="#e2e8f0">• Terraform IaC + Auto Teardown</text>
    <text x="90" y="455" font-family="sans-serif" font-size="11" fill="#fda4af">Phase 5 High-Performance</text>
  </g>

  <!-- Option 2: Gemini 1.5 Flash -->
  <g filter="url(#shadow)">
    <rect x="405" y="340" width="290" height="135" rx="10" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="405" y="340" width="290" height="30" rx="10" fill="#1e3a8a"/>
    <rect x="405" y="360" width="290" height="10" fill="#1e3a8a"/>
    <text x="420" y="360" font-family="sans-serif" font-size="12" font-weight="700" fill="#bfdbfe">Google Gemini 1.5 Flash</text>
    
    <text x="420" y="395" font-family="sans-serif" font-size="11" fill="#e2e8f0">• Cloud Multimodal REST API</text>
    <text x="420" y="415" font-family="sans-serif" font-size="11" fill="#e2e8f0">• Latency: 920 ms • 42 tok/s</text>
    <text x="420" y="435" font-family="sans-serif" font-size="11" fill="#e2e8f0">• Cost: $0.00 (15 RPM Free Tier)</text>
    <text x="420" y="455" font-family="sans-serif" font-size="11" fill="#93c5fd">Always-Free Production Fallback</text>
  </g>

  <!-- Option 3: Deterministic Mock -->
  <g filter="url(#shadow)">
    <rect x="735" y="340" width="290" height="135" rx="10" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="735" y="340" width="290" height="30" rx="10" fill="#064e3b"/>
    <rect x="735" y="360" width="290" height="10" fill="#064e3b"/>
    <text x="750" y="360" font-family="sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">In-Memory Mock Provider</text>
    
    <text x="750" y="395" font-family="sans-serif" font-size="11" fill="#e2e8f0">• 4 Presets: Muesli, Soda, Biscuits</text>
    <text x="750" y="415" font-family="sans-serif" font-size="11" fill="#e2e8f0">• Latency: 0.1 ms (Deterministic)</text>
    <text x="750" y="435" font-family="sans-serif" font-size="11" fill="#e2e8f0">• 100% Offline &amp; Isolated</text>
    <text x="750" y="455" font-family="sans-serif" font-size="11" fill="#6ee7b7">Safe for CI / Unit Test Suites</text>
  </g>

  <!-- ROW 3: DEVOPS AUTOMATION & OBSERVABILITY -->
  <!-- Left Box: Observability Stack -->
  <g filter="url(#shadow)">
    <rect x="50" y="530" width="480" height="230" rx="12" fill="url(#card-grad)" stroke="#eab308" stroke-width="1.5"/>
    <rect x="50" y="530" width="480" height="36" rx="12" fill="#713f12"/>
    <rect x="50" y="554" width="480" height="12" fill="#713f12"/>
    <text x="70" y="552" font-family="sans-serif" font-size="13" font-weight="700" fill="#fef08a">Observability Stack (Prometheus + Grafana)</text>

    <text x="70" y="590" font-family="sans-serif" font-size="12" fill="#d1d5db"><tspan font-weight="bold" fill="#facc15">Prometheus (Port 9090):</tspan> Scrapes API /metrics every 5 seconds</text>
    <text x="70" y="610" font-family="sans-serif" font-size="12" fill="#9ca3af">• http_requests_total, http_request_duration_seconds</text>
    <text x="70" y="630" font-family="sans-serif" font-size="12" fill="#9ca3af">• labellens_scans_total, labellens_red_flags_total</text>
    <text x="70" y="650" font-family="sans-serif" font-size="12" fill="#9ca3af">• Alert rules: HighLatency, 5xxErrorRate, CriticalFSSAIRedFlagSpike</text>

    <text x="70" y="685" font-family="sans-serif" font-size="12" fill="#d1d5db"><tspan font-weight="bold" fill="#facc15">Grafana (Port 3001):</tspan> Automated Dashboard Provisioning</text>
    <text x="70" y="705" font-family="sans-serif" font-size="12" fill="#9ca3af">• Real-time score distributions &amp; FSSAI violation trends</text>
    <text x="70" y="725" font-family="sans-serif" font-size="12" fill="#9ca3af">• Built-in health check: /api/health</text>
  </g>

  <!-- Right Box: AI-Assisted CI/CD Pipeline -->
  <g filter="url(#shadow)">
    <rect x="570" y="530" width="480" height="230" rx="12" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="570" y="530" width="480" height="36" rx="12" fill="#581c87"/>
    <rect x="570" y="554" width="480" height="12" fill="#581c87"/>
    <text x="590" y="552" font-family="sans-serif" font-size="13" font-weight="700" fill="#e9d5ff">AI-Assisted DevOps Showcase (GitHub Actions)</text>

    <text x="590" y="590" font-family="sans-serif" font-size="12" fill="#d1d5db"><tspan font-weight="bold" fill="#c084fc">DevSecOps:</tspan> Gitleaks secrets audit &amp; Aqua Trivy vulnerability scan</text>
    <text x="590" y="615" font-family="sans-serif" font-size="12" fill="#d1d5db"><tspan font-weight="bold" fill="#c084fc">Golden Eval Harness:</tspan> 22 ground-truth labels regression gate (100% pass)</text>
    <text x="590" y="640" font-family="sans-serif" font-size="12" fill="#d1d5db"><tspan font-weight="bold" fill="#c084fc">AI PR Reviewer:</tspan> Automated review of diffs against FSSAI &amp; security rules</text>
    <text x="590" y="665" font-family="sans-serif" font-size="12" fill="#d1d5db"><tspan font-weight="bold" fill="#c084fc">AI Failure Explainer:</tspan> Root-cause diagnosis with copy-paste remediation</text>
    <text x="590" y="690" font-family="sans-serif" font-size="12" fill="#d1d5db"><tspan font-weight="bold" fill="#c084fc">GPU Cost Guard:</tspan> Scheduled cron preventing zombie billing on droplets</text>
    <text x="590" y="715" font-family="sans-serif" font-size="12" fill="#d1d5db"><tspan font-weight="bold" fill="#c084fc">Continuous Deployment:</tspan> Multi-arch builds published to ghcr.io</text>
  </g>

  <!-- Connectors -->
  <path d="M 585 260 L 585 530" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3"/>
</svg>
