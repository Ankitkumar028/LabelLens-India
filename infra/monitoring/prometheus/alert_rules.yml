groups:
  - name: labellens_alerts
    rules:
      - alert: APIInstanceDown
        expr: up{job="labellens-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "LabelLens API instance is down"
          description: "Target {{ $labels.instance }} has been unreachable for more than 30 seconds."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "LabelLens API p95 latency is high (> 2s)"
          description: "95th percentile request latency is {{ $value }}s on {{ $labels.endpoint }}."

      - alert: High5xxErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Elevated 5xx Server Error Rate"
          description: "More than 5% of requests to LabelLens API are resulting in HTTP 5xx responses."

      - alert: CriticalFSSAIRedFlagSpike
        expr: sum(rate(labellens_red_flags_total{severity="CRITICAL"}[5m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High volume of CRITICAL FSSAI red flags detected"
          description: "Scans are triggering critical non-compliance violations at rate {{ $value }}/s."
