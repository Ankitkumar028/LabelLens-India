# fly.toml — Fly.io deployment config for LabelLens API
app = "labellens-api"
primary_region = "sin"

[build]
  dockerfile = "../../apps/api/Dockerfile"
  context = "../../apps/api"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  LLM_PROVIDER = "gemini"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
