name: CI Pipeline - Lint, Test, Security & Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. DevSecOps: Gitleaks Secrets Detection
  gitleaks:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # 2. Backend Unit Tests & Golden Eval Harness
  backend-test:
    name: Backend Tests & Golden Eval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Pytest Suite
        run: |
          cd apps/api
          pytest -v

      - name: Run Golden-Sample Eval Harness
        run: |
          python scripts/run_eval.py

  # 3. Frontend Unit Tests & Production Build
  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Vitest Suite
        working-directory: apps/web
        run: npm test

      - name: Build Production Assets
        working-directory: apps/web
        run: npm run build

  # 4. Container Build & Trivy Vulnerability Scan
  docker-security-scan:
    name: Docker Build & Trivy Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          load: true
          tags: labellens-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          load: true
          tags: labellens-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner on API Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "labellens-api:ci"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Run Trivy Vulnerability Scanner on Web Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "labellens-web:ci"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # 5. Local Docker Compose End-to-End Integration
  docker-compose-e2e:
    name: Docker Compose Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create local .env from .env.example
        run: cp .env.example .env

      - name: Start Full Stack with Docker Compose
        run: docker compose up -d --build

      - name: Wait for Services to become Healthy
        run: |
          echo "Waiting for containers to report healthy..."
          for i in {1..30}; do
            API_STATUS=$(docker inspect --format='{{json .State.Health.Status}}' labellens-api 2>/dev/null || echo '"unknown"')
            WEB_STATUS=$(docker inspect --format='{{json .State.Health.Status}}' labellens-web 2>/dev/null || echo '"unknown"')
            echo "Attempt $i: api=$API_STATUS, web=$WEB_STATUS"
            if [ "$API_STATUS" = '"healthy"' ] && [ "$WEB_STATUS" = '"healthy"' ]; then
              echo "Both containers are healthy!"
              break
            fi
            sleep 2
          done

      - name: Verify Backend /health Endpoint
        run: |
          curl -f http://localhost:8000/health

      - name: Verify Frontend /health Endpoint
        run: |
          curl -f http://localhost:3000/health

      - name: Verify Prometheus /-/healthy Endpoint
        run: |
          curl -f http://localhost:9090/-/healthy

      - name: Verify Grafana /api/health Endpoint
        run: |
          curl -f http://localhost:3001/api/health

      - name: Verify Reverse Proxy Analyze Flow
        run: |
          # Generate small test JPEG
          python3 -c "from PIL import Image; img = Image.new('RGB', (100, 100), color=(0, 255, 0)); img.save('smoke_test.jpg')"
          curl -f -X POST -F "file=@smoke_test.jpg" -F "preset=healthy_protein_muesli" http://localhost:3000/api/analyze


      - name: Teardown Docker Compose
        if: always()
        run: docker compose down -v
