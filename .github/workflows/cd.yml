name: CD Pipeline - Build, Publish & Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - 'infra/**'
      - 'docker-compose.yml'
      - 'render.yaml'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish OCI Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name
        id: repo_name
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.repo_name.outputs.IMAGE_PREFIX }}/api:latest
            ${{ steps.repo_name.outputs.IMAGE_PREFIX }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.repo_name.outputs.IMAGE_PREFIX }}/web:latest
            ${{ steps.repo_name.outputs.IMAGE_PREFIX }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-deployment:
    name: Trigger Live Deployment
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (API)
        if: env.RENDER_API_HOOK != ''
        env:
          RENDER_API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          echo "Triggering Render API deployment..."
          curl -s -X POST "$RENDER_API_HOOK"

      - name: Trigger Render Deploy Hook (Web)
        if: env.RENDER_WEB_HOOK != ''
        env:
          RENDER_WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          echo "Triggering Render Web deployment..."
          curl -s -X POST "$RENDER_WEB_HOOK"

      - name: Verify Live Production Health
        if: env.PROD_URL != ''
        env:
          PROD_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          echo "Checking $PROD_URL/health..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Production health check passed with status 200!"
              exit 0
            fi
            echo "Waiting for service to stabilize... (status: $STATUS)"
            sleep 10
          done
          echo "Warning: Health check did not return 200 within timeout."
