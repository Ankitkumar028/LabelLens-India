services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: labellens-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - labellens-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: labellens-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VLLM_API_BASE=${VLLM_API_BASE:-http://vllm:8001/v1}
      - RULES_CONFIG_PATH=/app/config/rules.yaml
      - ENVIRONMENT=${ENVIRONMENT:-development}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - labellens-net

networks:
  labellens-net:
    driver: bridge
